<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link src="src/output.css" rel="stylesheet">
    <title>Random Password Generator</title>
</head>

<body>
    <section>
        <h1>Generate a <strong>random password</strong></h1>
        <p>Never use an insecure password again.</p>

        <div class="box-options">
            <p class="tag">More options</p>
             <form>
                <label for="pw-range">Password Range:</label>
                <input type="range" name="pw-range" id="password-range" min="0" max="100" value="15">
             </form>

            <form>
                <p>Characters used:</p>
                <div>
                    <div>
                        <label for="numbers">Numbers</label>
                        <input type="checkbox" name="numbers" id="numbers" checked>                        
                    </div>
                    <div>
                        <label for="symbols">Symbols</label>
                        <input type="checkbox" name="symbols" id="symbols" checked>                        
                    </div>
                </div>
            </form>
        </div>

        <button id="generate-password">Generate passwords</button>

        <div class="passwords">
            <input type="text" readonly id="password-one">
            <input type="text" readonly id="password-two">
        </div>
    </section>

    <script src="index.js"></script>
</body>

</html>
